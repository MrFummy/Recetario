<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Origen de public/apple-touch-icon.png (180x180). iOS aplica él mismo las
       esquinas redondeadas y rellena de negro lo transparente, así que el fondo
       es un cuadrado completo y opaco, sin la sombra ni el giro del favicon.
